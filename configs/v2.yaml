# v2 protocol - FROZEN 2026-10-22. Chosen on development data only (4 dev seeds, fixed dev patient pool).
# Clinical: results/sweep_dev_clinical_fixeddev.json -> alpha 5, drift +3 SD on num_lab_procedures,
#   num_medications, time_in_hospital; CUSUM threshold 6; credits 10; b 0.25.
# Synthetic: results/sweep_dev_synthetic_4seeds.json -> credits 6 (threshold 6 from calibration_synthetic.json).
# Clinical periodic interval: confirm with `python -m src.calibrate --dataset clinical --config configs/v2.yaml --tag v2`.
# Do not edit after final v2 runs start. Run with: --config configs/v2.yaml --tag v2 and a NEW output folder.
num_clients: 4
horizon: 100
seeds:
- 11
- 22
- 33
- 44
- 55
dev_seeds:
- 101
- 102
- 103
- 104
null_post_start: 40
synthetic:
  n_features: 20
  batch_per_step: 64
  warm_per_client: 512
  calib_chunks: 20
  client_offset_sd: 0.5
  weight_sd: 0.5
  lead_weight_norm: 2.5
  base_prevalence: 0.3
  label_flip: 0.05
  offset_exclude_rotated: false
clinical:
  csv_path: data/raw/diabetic_data.csv
  pools:
  - 0.2
  - 0.2
  - 0.6
  calib_frac: 0.2
  dirichlet_alpha: 5.0
  min_client_final: 2000
  min_client_warm: 300
  max_retries: 50
  min_category_count: 10
  shift_feature: num_lab_procedures
  fixed_dev_pool: true
  dev_pool_seed: 2026
  shift_features:
  - num_lab_procedures
  - num_medications
  - time_in_hospital
  shift_magnitude: 3.0
model:
  hidden:
  - 64
  - 32
  lr: 0.001
  batch_size: 64
  local_epochs: 1
  buffer_size: 256
warm_start:
  rounds: 5
  local_epochs: 10
detector:
  allowance: 0.25
  threshold: 6.0
  cooldown: 5
  sd_floor: 0.05
  loss_clip: 5.0
  refresh_window: 5
  credits: 3
  expiry: 15
  severity_clip: 3.0
policy:
  eta: 1.0
  wait_norm: 10
  periodic_interval: 2
budget:
  b: 0.25
  bucket_full_rounds: 2
accounting:
  monitor_bytes: 16
  selection_bytes: 8
  overhead_sensitivity_bytes: 64
evaluation:
  window: 10
  match_window: 15
  recovery_window: 5
  recovery_consecutive: 3
  recovery_tolerance: 0.1
  recovery_floor: 0.01
  pre_event_steps: 10
checkpoint_every: 10
dataset_overrides:
  clinical:
    detector:
      threshold: 6.0
      credits: 10
    policy:
      periodic_interval: 2
  synthetic:
    detector:
      credits: 6
protocol_version: v2
