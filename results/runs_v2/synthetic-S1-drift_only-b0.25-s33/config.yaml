  csv_path: data/raw/diabetic_data.csv
  dev_pool_seed: 2026
  dirichlet_alpha: 5.0
  fixed_dev_pool: true
  max_retries: 50
  min_category_count: 10
  min_client_final: 2000
  min_client_warm: 300
